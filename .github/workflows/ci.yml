name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt required:"
            gofmt -l .
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go test (integration)
        run: go test -tags=integration ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4

      - name: Docker build
        run: docker build -t go-backend:ci .
