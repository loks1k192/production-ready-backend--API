services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      APP_ENV: dev
      HTTP_ADDR: :8080
      DB_DSN: postgres://postgres:postgres@db:5432/app?sslmode=disable
      AUTH_JWT_SECRET: change-me
      AUTH_TOKEN_TTL: 1h
      LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  db_data:
